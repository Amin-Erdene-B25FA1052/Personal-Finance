<!doctype html><html lang="mn"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Миний санхүү</title><style>
:root{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;color:#17223b;background:#f4f6fb}*{box-sizing:border-box}body{margin:0}header{background:#182944;color:white;padding:22px max(22px,calc((100% - 1120px)/2));display:flex;align-items:center;justify-content:space-between;gap:16px}header a{color:white;text-decoration:none;margin-left:20px}main{max-width:1120px;margin:30px auto;padding:0 18px}.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:14px}.card,.panel{background:white;border:1px solid #e3e8f0;border-radius:14px;padding:20px;box-shadow:0 3px 14px #16243d09}.card small{color:#65738a}.card h2{margin:10px 0 0;font-size:25px}.panel{margin-top:20px}h1{font-size:25px}h2{font-size:19px}input,select,button{font:inherit;border-radius:8px;padding:9px;border:1px solid #cbd5e1}button{background:#2554a3;color:white;cursor:pointer;border:0}table{width:100%;border-collapse:collapse;font-size:13px}th,td{padding:10px;border-bottom:1px solid #edf0f4;text-align:left}th{color:#66758a}form.inline{display:flex;gap:6px;align-items:center}form.inline select{max-width:190px;font-size:12px}.scroll{overflow-x:auto}.notice{background:#e9f5ff;border:1px solid #b7dcf5;padding:12px;border-radius:9px;margin-bottom:14px}.muted{color:#65738a}.positive{color:#138257}.negative{color:#bc3e48}nav{white-space:nowrap}@media(max-width:700px){header{flex-direction:column;align-items:flex-start}table{min-width:850px}}
</style></head><body><header><strong>💳 Миний санхүү</strong><nav><a href="/dashboard">Dashboard</a><a href="/">Тайлан</a><a href="/merchants">Худалдааны газрууд</a></nav></header><main>{% with messages=get_flashed_messages() %}{% for m in messages %}<div class="notice">{{m}}</div>{% endfor %}{% endwith %}{% block content %}{% endblock %}</main></body></html>
